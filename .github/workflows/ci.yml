name: CI

# Continuous integration for Employee-Place (Confidential Salary Benchmarking
# Pool). Runs on every push and pull request: installs dependencies, compiles
# the Compact contract, checks types, builds the production frontend, and runs
# the full test suite.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Install · typecheck · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Midnight Compact devtools
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Compact toolchain 0.31.1
        run: |
          compact update 0.31
          compact --version
          compact compile --version

      - name: Compile Compact contract
        run: npm run compile

      - name: TypeScript check (root tooling + contract tests)
        run: npm run build

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend (production)
        run: npm run frontend:build

      - name: Run tests
        run: npm test
