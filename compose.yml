# Local Midnight devnet for the Confidential Salary Benchmarking Pool.
#
# LOCAL DEVELOPMENT ONLY — do not expose these ports to a public network.
# The ports are offset (9940/8085/6305) so this devnet can run side-by-side
# with other Midnight bootcamp projects on the same machine.
#
# Tear down with: docker compose down -v
#
# The genesis seed produced by this devnet is the well-known
# 0000...0001 seed used by all Midnight developer tooling.

name: salary-benchmarking-devnet

services:
  node:
    image: midnightntwrk/midnight-node:1.0.0
    container_name: salary-benchmarking-node
    ports:
      - "9940:9940"
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"chain_getBlockHash\",\"params\":[1]}' http://localhost:9940 | grep -q '\"result\":\"0x'",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s

  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: salary-benchmarking-indexer
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      APP__INFRA__NODE__URL: "ws://node:9940"
      APP__INFRA__STORAGE__PASSWORD: "indexer"
      APP__INFRA__PUB_SUB__PASSWORD: "indexer"
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: "indexer"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__SPO_NODE__URL: "ws://node:9940"
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "local-devnet-dummy-id"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: salary-benchmarking-proof-server
    command: ["midnight-proof-server -v"]
    ports:
      - "6305:6305"
    environment:
      RUST_BACKTRACE: "full"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/6305"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s